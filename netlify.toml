[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/tokenizer.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/tokens.tsv"
  [headers.values]
    Content-Type = "text/tab-separated-values; charset=utf-8"
